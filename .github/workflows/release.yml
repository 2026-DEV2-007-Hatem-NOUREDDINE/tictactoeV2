# =============================================================================
# 🚀 Auto Release Workflow
# =============================================================================
# Automatically creates a GitHub release when code is merged to main
#
# Features:
# - Triggered on push to main (after PR merge)
# - Builds release APK
# - Auto-generates version based on date/commit
# - Creates GitHub release with APK attached
# - Generates changelog from commits
# =============================================================================

name: 🚀 Release

on:
    push:
        branches:
            - main
        paths-ignore:
            - '**.md'
            - '.github/workflows/android_check.yml'
            - 'snapshots/**'

env:
    JAVA_VERSION: '21'
    JAVA_DISTRIBUTION: 'temurin'

jobs:
    release:
        name: 📦 Build & Release
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            -   name: 📥 Checkout code
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0  # Full history for changelog

            -   name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
                uses: actions/setup-java@v4
                with:
                    java-version: ${{ env.JAVA_VERSION }}
                    distribution: ${{ env.JAVA_DISTRIBUTION }}

            -   name: 📦 Setup Gradle
                uses: gradle/actions/setup-gradle@v4

            -   name: 🔑 Grant execute permission for gradlew
                run: chmod +x gradlew

            -   name: 📅 Generate Version
                id: version
                run: |
                    # Generate version based on date and short commit hash
                    VERSION_DATE=$(date +'%Y.%m.%d')
                    VERSION_COMMIT=$(git rev-parse --short HEAD)
                    VERSION="${VERSION_DATE}-${VERSION_COMMIT}"

                    echo "version=${VERSION}" >> $GITHUB_OUTPUT
                    echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
                    echo "📅 Version: ${VERSION}"

            -   name: 🏗️ Build Release APK
                run: |
                    echo "::group::Building Release APK"
                    ./gradlew assembleRelease --build-cache
                    echo "::endgroup::"

            -   name: 📝 Generate Changelog
                id: changelog
                run: |
                    echo "# 📋 Changelog" > CHANGELOG.md
                    echo "" >> CHANGELOG.md
                    echo "## What's Changed" >> CHANGELOG.md
                    echo "" >> CHANGELOG.md

                    # Get commits since last tag or last 10 commits
                    LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

                    if [ -n "$LAST_TAG" ]; then
                      echo "Changes since ${LAST_TAG}:" >> CHANGELOG.md
                      echo "" >> CHANGELOG.md
                      git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.md
                    else
                      echo "Recent changes:" >> CHANGELOG.md
                      echo "" >> CHANGELOG.md
                      git log -10 --pretty=format:"- %s (%h)" >> CHANGELOG.md
                    fi

                    echo "" >> CHANGELOG.md
                    echo "" >> CHANGELOG.md
                    echo "---" >> CHANGELOG.md
                    echo "" >> CHANGELOG.md
                    echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ steps.version.outputs.tag }}" >> CHANGELOG.md

                    cat CHANGELOG.md

            -   name: 📁 Prepare Release Assets
                id: assets
                run: |
                    mkdir -p release-assets

                    # Find and copy APK
                    APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
                    if [ -n "$APK_PATH" ]; then
                      APK_NAME="tictactoe-${{ steps.version.outputs.version }}.apk"
                      cp "$APK_PATH" "release-assets/${APK_NAME}"
                      echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
                      echo "✅ APK prepared: ${APK_NAME}"
                    else
                      echo "❌ No APK found!"
                      exit 1
                    fi

            -   name: 🏷️ Create Git Tag
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.version }}"
                    git push origin "${{ steps.version.outputs.tag }}"

            -   name: 🚀 Create GitHub Release
                uses: softprops/action-gh-release@v2
                with:
                    tag_name: ${{ steps.version.outputs.tag }}
                    name: "🎮 Tic Tac Toe ${{ steps.version.outputs.version }}"
                    body_path: CHANGELOG.md
                    draft: false
                    prerelease: false
                    files: |
                        release-assets/${{ steps.assets.outputs.apk_name }}
                    generate_release_notes: true

            -   name: 📊 Release Summary
                run: |
                    echo "# 🚀 Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "## 📦 Release Details" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
                    echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
                    echo "| 🏷️ Tag | \`${{ steps.version.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
                    echo "| 📅 Version | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
                    echo "| 📱 APK | \`${{ steps.assets.outputs.apk_name }}\` |" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "🔗 [View Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }})" >> $GITHUB_STEP_SUMMARY
